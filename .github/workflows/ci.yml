name: CI — Build & Tests

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup local.properties
        run: |
          echo "SUPABASE_URL_DEV=${{ secrets.SUPABASE_URL_DEV }}" >> local.properties
          echo "SUPABASE_ANON_KEY_DEV=${{ secrets.SUPABASE_ANON_KEY_DEV }}" >> local.properties
          echo "SUPABASE_URL_PROD=${{ secrets.SUPABASE_URL_PROD }}" >> local.properties
          echo "SUPABASE_ANON_KEY_PROD=${{ secrets.SUPABASE_ANON_KEY_PROD }}" >> local.properties

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build Android Debug
        run: ./gradlew :androidApp:assembleDebug

      - name: Run Unit Tests
        run: ./gradlew :shared:testDebugUnitTest
